<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Emotional Check-in | MindBridge</title>

    <!-- Existing MindBridge global CSS -->
    <link
        rel="stylesheet"
        href="../css/global.css"
    >

    <style>

        body {
            min-height: 100vh;
            background:
                radial-gradient(
                    circle at top left,
                    rgba(89, 70, 160, 0.18),
                    transparent 35%
                ),
                #080b12;

            color: #f5f5f5;
            font-family: Arial, sans-serif;
        }


        /* =========================================
           PAGE HEADER
        ========================================= */

        .checkin-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 22px 6%;
            border-bottom: 1px solid rgba(255,255,255,0.08);
        }


        .brand {
            font-size: 24px;
            font-weight: 700;
            text-decoration: none;
            color: white;
        }


        .back-btn {
            text-decoration: none;
            color: #c8c8d0;
            font-size: 14px;
        }


        .back-btn:hover {
            color: white;
        }


        /* =========================================
           MAIN
        ========================================= */

        .checkin-main {
            width: min(900px, 90%);
            margin: 60px auto;
        }


        .checkin-intro {
            text-align: center;
            margin-bottom: 40px;
        }


        .checkin-label {
            display: inline-block;
            padding: 8px 14px;
            border-radius: 20px;
            background: rgba(123, 97, 255, 0.12);
            color: #b9a8ff;
            font-size: 13px;
            margin-bottom: 18px;
        }


        .checkin-intro h1 {
            font-size: clamp(32px, 5vw, 52px);
            margin: 0 0 15px;
        }


        .checkin-intro p {
            max-width: 600px;
            margin: auto;
            color: #9fa1ad;
            line-height: 1.7;
        }


        /* =========================================
           CARD
        ========================================= */

        .checkin-card {
            background: rgba(18, 21, 31, 0.95);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 22px;
            padding: 35px;
        }


        .question {
            margin-bottom: 35px;
        }


        .question h2 {
            font-size: 21px;
            margin-bottom: 20px;
        }


        /* =========================================
           MOODS
        ========================================= */

        .mood-grid {
            display: grid;
            grid-template-columns:
                repeat(auto-fit, minmax(120px, 1fr));
            gap: 14px;
        }


        .mood-button {
            background: #111520;
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 16px;
            padding: 20px 10px;
            cursor: pointer;
            color: white;
            transition: 0.2s ease;
        }


        .mood-button:hover {
            transform: translateY(-3px);
            border-color: #7966e8;
        }


        .mood-button.selected {
            border-color: #8b75ff;
            background: rgba(116, 91, 220, 0.18);
        }


        .mood-emoji {
            display: block;
            font-size: 32px;
            margin-bottom: 10px;
        }


        .mood-name {
            font-size: 14px;
        }


        /* =========================================
           INTENSITY
        ========================================= */

        .intensity-container {
            display: flex;
            align-items: center;
            gap: 20px;
        }


        #intensity {
            width: 100%;
        }


        #intensityValue {
            min-width: 45px;
            text-align: center;
            padding: 8px;
            background: #111520;
            border-radius: 8px;
        }


        /* =========================================
           NOTE
        ========================================= */

        textarea {
            width: 100%;
            min-height: 130px;
            resize: vertical;
            padding: 15px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.1);
            background: #0d1018;
            color: white;
            font-size: 15px;
            box-sizing: border-box;
        }


        textarea:focus {
            outline: none;
            border-color: #7966e8;
        }


        /* =========================================
           BUTTON
        ========================================= */

        .save-button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 12px;
            background: #6957d9;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }


        .save-button:hover {
            opacity: 0.9;
        }


        .save-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }


        /* =========================================
           MESSAGE
        ========================================= */

        #checkinMessage {
            text-align: center;
            margin-top: 18px;
            min-height: 22px;
            font-size: 14px;
        }


        .success-message {
            color: #72d6a0;
        }


        .error-message {
            color: #ff7d7d;
        }


        @media (max-width: 600px) {

            .checkin-card {
                padding: 24px 18px;
            }

            .checkin-main {
                margin-top: 35px;
            }

        }

    </style>

</head>


<body>


    <!-- =========================================
         HEADER
    ========================================== -->

    <header class="checkin-header">

        <a
            href="../index.html"
            class="brand"
        >
            MindBridge
        </a>


        <a
            href="./dashboard.html"
            class="back-btn"
        >
            ← Back to Dashboard
        </a>

    </header>



    <!-- =========================================
         MAIN
    ========================================== -->

    <main class="checkin-main">


        <section class="checkin-intro">

            <span class="checkin-label">
                EMOTIONAL CHECK-IN
            </span>

            <h1>
                How are you feeling?
            </h1>

            <p>
                Take a moment to check in with yourself.
                Choose the emotion that best describes how
                you're feeling right now.
            </p>

        </section>



        <section class="checkin-card">


            <!-- MOOD -->

            <div class="question">

                <h2>
                    What best describes your mood?
                </h2>


                <div class="mood-grid">


                    <button
                        type="button"
                        class="mood-button"
                        data-mood="Great"
                    >
                        <span class="mood-emoji">
                            😄
                        </span>

                        <span class="mood-name">
                            Great
                        </span>
                    </button>


                    <button
                        type="button"
                        class="mood-button"
                        data-mood="Good"
                    >
                        <span class="mood-emoji">
                            🙂
                        </span>

                        <span class="mood-name">
                            Good
                        </span>
                    </button>


                    <button
                        type="button"
                        class="mood-button"
                        data-mood="Okay"
                    >
                        <span class="mood-emoji">
                            😐
                        </span>

                        <span class="mood-name">
                            Okay
                        </span>
                    </button>


                    <button
                        type="button"
                        class="mood-button"
                        data-mood="Low"
                    >
                        <span class="mood-emoji">
                            😔
                        </span>

                        <span class="mood-name">
                            Low
                        </span>
                    </button>


                    <button
                        type="button"
                        class="mood-button"
                        data-mood="Stressed"
                    >
                        <span class="mood-emoji">
                            😣
                        </span>

                        <span class="mood-name">
                            Stressed
                        </span>
                    </button>


                </div>

            </div>



            <!-- INTENSITY -->

            <div class="question">

                <h2>
                    How strongly are you feeling this?
                </h2>


                <div class="intensity-container">

                    <input
                        type="range"
                        id="intensity"
                        min="1"
                        max="10"
                        value="5"
                    >

                    <span id="intensityValue">
                        5
                    </span>

                </div>

            </div>



            <!-- NOTE -->

            <div class="question">

                <h2>
                    Want to share what's on your mind?
                </h2>


                <textarea
                    id="checkinNote"
                    maxlength="500"
                    placeholder="Write anything you'd like to reflect on... (optional)"
                ></textarea>

            </div>



            <!-- SAVE -->

            <button
                type="button"
                id="saveCheckinBtn"
                class="save-button"
            >
                Save Check-in
            </button>


            <div
                id="checkinMessage"
                role="alert"
            ></div>


        </section>


    </main>



    <!-- =========================================
         JAVASCRIPT
    ========================================== -->

    <script
        type="module"
        src="../js/emotional-checkin.js"
    ></script>


</body>

</html>
